services:
  - type: web
    name: king-gemini-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: ALLOWED_ORIGINS
        value: https://jose23frederico23-tech.github.io
