services:
  - type: web
    name: king-gemini-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: ALLOWED_ORIGINS
        value: https://king-silk-six.vercel.app
      - key: SERVE_STATIC
        value: "false"
